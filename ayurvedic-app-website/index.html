<html lang="en">
  <head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AYURVEDA | Natural Healing, BHMS Consultations & Traceable Raw Herbs</title>
    <meta name="description" content="Integrative Ayurvedic healthcare platform offering qualified BHMS doctor consultations, 100% farm-traceable raw herbs with lab reports, and personalized chronic disease programs." />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&family=Playfair+Display:ital,wght@0,500;0,600;1,400&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root"></div>

    <!-- Off-screen Google Translate Element Container (Must be in layout tree for Google script to init) -->
    <div id="google_translate_element" style="position:fixed;bottom:-1000px;left:-1000px;opacity:0;pointer-events:none;z-index:-1;"></div>

    <!-- Clean CSS for Google Translate (completely suppresses Google's intrusive banner with the buggy 'X') -->
    <style>
      .goog-te-banner-frame,
      .goog-te-banner-frame.skiptranslate,
      iframe[class*="goog-te-banner-frame"],
      .goog-te-gadget-icon,
      .goog-te-gadget-simple,
      .VIpgJd-ZVi9I-ORHb-OEVmcd,
      .VIpgJd-ZVi9I-ORHb,
      .skiptranslate iframe {
        display: none !important;
        visibility: hidden !important;
        height: 0 !important;
        pointer-events: none !important;
      }
      body {
        top: 0px !important;
        position: static !important;
      }
      .goog-tooltip,
      .goog-tooltip:hover {
        display: none !important;
      }
      .goog-text-highlight {
        background-color: transparent !important;
        border: none !important;
        box-shadow: none !important;
      }
      #goog-gt-tt {
        display: none !important;
        visibility: hidden !important;
      }
    </style>

    <!-- Google Website Translator Script -->
    <script type="text/javascript">
      function googleTranslateElementInit() {
        if (window.google && window.google.translate) {
          new window.google.translate.TranslateElement({
            pageLanguage: 'en',
            includedLanguages: 'en,hi',
            autoDisplay: false
          }, 'google_translate_element');
        }
      }
    </script>
    <script type="text/javascript" src="https://translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
